databases:
  - name: isa-link-db
    plan: free
    databaseName: isa_link
    user: isa_link

services:
  - type: web
    name: isa-link
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    # Migrations run at startup (preDeployCommand requires a paid plan)
    startCommand: npm run start:render
    initialDeployHook: npm run db:seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: isa-link-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
